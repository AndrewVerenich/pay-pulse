# Flink Payment Intelligence overlay.
# Используется вместе с базовым compose:
#   ./gradlew :flink-payment-intelligence:shadowJar
#   docker compose -f docker-compose.yml -f compose.stream.yml up -d
services:
  flink-jobmanager:
    image: flink:1.17.2-scala_2.12-java11
    container_name: paypulse-flink-jm
    ports:
      - "8081:8081"
      - "9249:9249"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        mkdir -p /checkpoints/paypulse-flink
        chown -R flink:flink /checkpoints
        exec /docker-entrypoint.sh jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 1024m
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    volumes:
      - flink-checkpoints:/checkpoints

  flink-taskmanager:
    image: flink:1.17.2-scala_2.12-java11
    container_name: paypulse-flink-tm
    depends_on:
      - flink-jobmanager
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        mkdir -p /checkpoints/paypulse-flink
        chown -R flink:flink /checkpoints
        exec /docker-entrypoint.sh taskmanager
    scale: 1
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
        taskmanager.memory.process.size: 1536m
    volumes:
      - flink-checkpoints:/checkpoints

  flink-submit:
    image: flink:1.17.2-scala_2.12-java11
    container_name: paypulse-flink-submit
    depends_on:
      flink-jobmanager:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    environment:
      PAYPULSE_KAFKA_BOOTSTRAP: kafka:9092
    volumes:
      - ./flink-payment-intelligence/build/libs/flink-payment-intelligence-all.jar:/job.jar:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        sleep 15
        flink run -d -m flink-jobmanager:8081 -c com.paypulse.flink.PaymentIntelligenceJob /job.jar
    restart: "no"

volumes:
  flink-checkpoints:
