# Observability overlay (Prometheus + Grafana + exporters).
# Usage:
#   docker compose -f docker-compose.yml -f compose.observability.yml up -d
services:
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: paypulse-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    networks:
      - default

  grafana:
    image: grafana/grafana:10.4.2
    container_name: paypulse-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - default

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: paypulse-kafka-exporter
    command:
      - --kafka.server=kafka:9092
    ports:
      - "9308:9308"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - default

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: paypulse-postgres-exporter
    environment:
      DATA_SOURCE_NAME: postgresql://postgres:postgres@postgres:5432/paypulse?sslmode=disable
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default

  cadvisor:
    profiles: ["cadvisor"]
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: paypulse-cadvisor
    ports:
      - "8089:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - default
