spring:
  application:
    name: account-query-service
  r2dbc:
    url: r2dbc:postgresql://${PAYPULSE_DB_HOST:localhost}:${PAYPULSE_DB_PORT:5432}/${PAYPULSE_DB_NAME:paypulse}
    username: ${PAYPULSE_DB_USER:postgres}
    password: ${PAYPULSE_DB_PASSWORD:postgres}
    pool:
      initial-size: 5
      max-size: 20

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus

logging:
  level:
    com.paypulse: INFO
