x-airflow-common: &airflow-common
  build:
    context: ./airflow
    dockerfile: Dockerfile
  image: paypulse-airflow:2.8.3
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres:5432/paypulse?options=-csearch_path%3Dairflow
    AIRFLOW__CORE__FERNET_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef="
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
    CLICKHOUSE_HOST: clickhouse
    CLICKHOUSE_PORT: "8123"
    CLICKHOUSE_USER: default
    CLICKHOUSE_PASSWORD: ""
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./analytics/dbt:/opt/dbt
    - ./analytics/dbt/profiles.yml.example:/opt/dbt/profiles.yml:ro
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy
    liquibase-migrate:
      condition: service_completed_successfully
    clickhouse:
      condition: service_started

services:
  airflow-init:
    <<: *airflow-common
    container_name: paypulse-airflow-init
    entrypoint: /entrypoint
    command:
      - bash
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin --password admin \
          --firstname PayPulse --lastname Admin \
          --role Admin --email admin@paypulse.local || true
        echo "Airflow initialized."
    restart: "no"
  airflow-webserver:
    <<: *airflow-common
    container_name: paypulse-airflow-webserver
    command: webserver
    ports:
      - "18087:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: paypulse-airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  superset-init:
    build:
      context: ./analytics/superset
      dockerfile: Dockerfile
    container_name: paypulse-superset-init
    depends_on:
      clickhouse:
        condition: service_started
    environment:
      SUPERSET_SECRET_KEY: "paypulse-superset-dev-secret-key"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
    volumes:
      - ./analytics/superset/init:/app/init:ro
      - superset_home:/app/superset_home
    entrypoint: /bin/bash
    command: /app/init/bootstrap.sh

  superset:
    build:
      context: ./analytics/superset
      dockerfile: Dockerfile
    container_name: paypulse-superset
    ports:
      - "18089:8088"
    environment:
      SUPERSET_SECRET_KEY: "paypulse-superset-dev-secret-key"
      SUPERSET_LOAD_EXAMPLES: "no"
    volumes:
      - superset_home:/app/superset_home
    depends_on:
      superset-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

volumes:
  superset_home:
