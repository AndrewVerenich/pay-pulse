spring:
  application:
    name: projection-balance
  r2dbc:
    url: r2dbc:postgresql://${PAYPULSE_DB_HOST:localhost}:${PAYPULSE_DB_PORT:5432}/${PAYPULSE_DB_NAME:paypulse}
    username: ${PAYPULSE_DB_USER:postgres}
    password: ${PAYPULSE_DB_PASSWORD:postgres}
    pool:
      initial-size: 5
      max-size: 10
  kafka:
    bootstrap-servers: ${PAYPULSE_KAFKA_BOOTSTRAP:kafka:9092}
    consumer:
      group-id: projection-balance
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      properties:
        isolation.level: read_committed
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    listener:
      ack-mode: manual_immediate

paypulse:
  kafka:
    payment-events-topic: payment.events
    consumer-group: projection-balance
  metrics:
    projection-lag-interval-ms: 30000

server:
  port: ${SERVER_PORT:8088}

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus

logging:
  level:
    com.paypulse.projection: INFO
