spring:
  application:
    name: participant-risk-scoring
  r2dbc:
    url: r2dbc:postgresql://${PAYPULSE_DB_HOST:localhost}:${PAYPULSE_DB_PORT:55432}/${PAYPULSE_DB_NAME:paypulse}
    username: ${PAYPULSE_DB_USER:postgres}
    password: ${PAYPULSE_DB_PASSWORD:postgres}
  kafka:
    bootstrap-servers: ${PAYPULSE_KAFKA_BOOTSTRAP:localhost:19092}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: true

paypulse:
  saga:
    participant:
      enabled: true
      command-topic: saga.commands.risk-scoring
      reply-topic: saga.replies

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, info

server:
  port: ${SERVER_PORT:8092}
