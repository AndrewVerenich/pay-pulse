server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/live/ {
    access_log off;
    proxy_pass http://auth-gateway:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }

  location /api/ {
    proxy_pass http://auth-gateway:8090;
    proxy_set_header Host $host;
  }

  location /auth/ {
    proxy_pass http://auth-gateway:8090;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri /index.html;
  }
}
