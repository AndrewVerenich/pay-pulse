version: 2

models:
  - name: mart_daily_risk_report
    columns:
      - name: report_date
        tests: [not_null]
      - name: avg_fraud_score
        tests:
          - fraud_score_in_range

  - name: mart_aml_structuring_patterns
    columns:
      - name: account_id
        tests: [not_null]
      - name: daily_total
        tests:
          - positive_amount

  - name: mart_customer_risk_rfm
    columns:
      - name: account_id
        tests: [not_null, unique]
      - name: risk_segment
        tests:
          - accepted_values:
              values: ['LOW', 'MEDIUM', 'HIGH']

  - name: mart_settlement_latency
    columns:
      - name: saga_id
        tests: [not_null]
      - name: latency_seconds
        tests:
          - positive_amount

  - name: mart_merchant_risk_profile
    columns:
      - name: merchant_id
        tests: [not_null]

  - name: mart_daily_revenue
    columns:
      - name: revenue_date
        tests: [not_null]
      - name: total_revenue
        tests:
          - positive_amount
