version: 2

models:
  - name: fct_payments
    columns:
      - name: payment_sk
        tests: [not_null, unique]
      - name: account_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_account')
              field: account_sk
      - name: merchant_sk
        tests:
          - relationships:
              to: ref('dim_merchant')
              field: merchant_sk
      - name: currency_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_currency')
              field: currency_sk
      - name: amount
        tests:
          - positive_amount

  - name: fct_fraud_alerts
    columns:
      - name: alert_sk
        tests: [not_null, unique]
      - name: score
        tests:
          - fraud_score_in_range
      - name: account_sk
        tests:
          - relationships:
              to: ref('dim_account')
              field: account_sk
      - name: rule_sk
        tests:
          - relationships:
              to: ref('dim_rule')
              field: rule_sk
